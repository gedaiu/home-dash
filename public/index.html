<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUE-RASSIC PARK</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="loading" style="padding: 40px; text-align: center;">Loading...</div>
  </div>

  <div class="modal" id="discover-modal" hidden>
    <div class="modal-content">
      <div class="modal-header">
        <span id="modal-title">DISCOVERING DEVICES</span>
        <button class="btn-icon modal-close" id="modal-close">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="modal-body" id="modal-body">
        <div class="loading">Scanning network...</div>
      </div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
